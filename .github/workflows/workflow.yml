name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  test:
    name: "${{ matrix.test_file }} (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - test_file: tests/test_unit.py
            python-version: "3.12"
            main_only: false

          - test_file: tests/test_unit.py
            python-version: "3.13"
            main_only: false

          - test_file: tests/test_simple.py
            python-version: "3.12"
            main_only: false

          - test_file: tests/test_simple.py
            python-version: "3.13"
            main_only: false

          - test_file: tests/test_integration.py
            python-version: "3.12"
            main_only: true

    if: ${{ matrix.main_only == false || github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install ".[dev]"

      - name: Run tests with coverage
        run: |
          uv run pytest "${{ matrix.test_file }}" \
            --cov=poresim \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: PoreMS/PoreSim
          files: ./coverage.xml
          flags: ${{ matrix.test_file }}-py${{ matrix.python-version }}
          name: "${{ matrix.test_file }} Python ${{ matrix.python-version }}"
          
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -r docs/requirements.txt

      - name: Build Sphinx docs
        run: sphinx-build -E -a -b html docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

