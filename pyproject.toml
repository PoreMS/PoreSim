[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poresim"
dynamic = ["version"]
authors = [
    {name = "Hamzeh Kraus", email = "kraus@itt.uni-stuttgart.de"},
    {name = "Marc Högler", email = "hoegler@itt.uni-stuttgart.de"},
]
maintainers = [
    {name = "Marc Högler", email = "hoegler@itt.uni-stuttgart.de"},
]
description = "Pore system simulation generator."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "pore",
    "nanopore",
    "molecular dynamics",
    "simulation",
    "simulation setup",
    "GROMACS",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.0",
]

[project.urls]
Homepage = "https://github.com/PoreMS/PoreSim"
Repository = "https://github.com/PoreMS/PoreSim"
Documentation = "https://porems.github.io/PoreSim/"
Changelog = "https://github.com/PoreMS/PoreSim/blob/main/CHANGELOG.md"
Issues = "https://github.com/PoreMS/PoreSim/issues"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
# the suite writes into tests/output, and pytest would otherwise collect files
# such as output/test/test.txt there as doctests
norecursedirs = ["output", "data"]
addopts = "-ra -q"

[tool.coverage.run]
source_pkgs = ["poresim"]
branch = true
omit = ["*/poresim/templates/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["poresim/templates"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.dynamic]
version = {attr = "poresim.__version__"}

[tool.setuptools.packages.find]
include = ["poresim*"]

[tool.setuptools.package-data]
poresim = ["templates/*"]
